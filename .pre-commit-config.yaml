# Hygiene hooks come from pre-commit-hooks; ruff and mypy run through uv so
# they use exactly the versions pinned in uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Task input data is byte-exact on purpose (trailing spaces included).
      - id: trailing-whitespace
        exclude: ^examples/.*/environment/workspace/
      - id: end-of-file-fixer
        exclude: ^examples/.*/environment/workspace/
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict (src)
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
