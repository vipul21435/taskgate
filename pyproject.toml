[project]
name = "taskgate"
version = "0.1.0"
description = "Review gates for pull requests that add or change benchmark tasks for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "typer>=0.27.2",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.scripts]
taskgate = "taskgate.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PTH", "RET"]

[tool.ruff.lint.per-file-ignores]
# Runs inside task images under their own Python (3.8 and later), where
# Path.readlink and Path.hardlink_to do not exist yet; it uses os functions throughout.
"src/taskgate/snapshot.py" = ["PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: needs a real Docker daemon; opt in with TASKGATE_DOCKER_TESTS=1 (make test-docker)",
]

[tool.coverage.run]
source = ["taskgate"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
