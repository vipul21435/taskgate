# An example third-party gate package. Installing it next to TaskGate
# (uv pip install ./examples/plugin) makes `taskgate gates` list TG701.
[project]
name = "taskgate-todo-gate"
version = "0.1.0"
description = "Example TaskGate plugin: flag TODO, FIXME and XXX markers left in a task."
requires-python = ">=3.12"
dependencies = ["taskgate"]

[project.entry-points."taskgate.gates"]
todo-markers = "taskgate_todo_gate:no_todo_markers"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["taskgate_todo_gate.py"]
