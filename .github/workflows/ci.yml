name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests with coverage gate
        run: make cov
      - name: Demo on the bundled sample repository
        run: make demo

  docker:
    name: docker build + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t taskgate:ci .
      - name: Run the demo inside the image
        run: |
          docker run --rm taskgate:ci version
          docker run --rm taskgate:ci tasks examples/sample-repo
      - name: Strict mode rejects the incomplete sample task
        run: |
          if docker run --rm taskgate:ci tasks --strict examples/sample-repo; then
            echo "expected a non-zero exit for the incomplete sample task" >&2
            exit 1
          fi
