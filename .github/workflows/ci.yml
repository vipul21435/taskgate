name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests with coverage gate
        run: make cov
      - name: Demo - build the sample repository and check both task pull requests
        run: make demo
      - name: Publish the demo reports to the job summary
        if: always()
        run: cat .taskgate/demo/out/pr/*/report.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker build + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t taskgate:ci .
      - name: Run the demo inside the image
        run: |
          docker run --rm taskgate:ci version
          docker run --rm --entrypoint sh taskgate:ci examples/demo.sh /tmp/taskgate-demo
      - name: Check every bundled sample task inside the image (the draft must be blocked)
        run: |
          if docker run --rm taskgate:ci check --all examples/sample-repo; then
            echo "expected a blocking failure for the incomplete draft task" >&2
            exit 1
          fi
